name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Uji perhitungan (unit test)
        run: gradle testDebugUnitTest --stacktrace

      - name: Ringkasan hasil tes
        if: always()
        run: |
          total=0; failed=0
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            name=$(basename "$f" .xml | sed 's/^TEST-//; s/.*\.//')
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            x=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            e=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            total=$((total + t)); failed=$((failed + x + e))
            echo "::notice title=Tes $name::$t tes, $((x + e)) gagal"
          done
          echo "::notice title=Total tes::$total tes, $failed gagal"
          test "$total" -gt 0

      - name: Bangun APK debug
        run: gradle assembleDebug --stacktrace

      - name: Beri nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AuroraShop-debug-${{ github.run_number }}.apk

      - name: Simpan skema database
        uses: actions/upload-artifact@v4
        with:
          name: skema-database
          path: app/schemas/

      - name: Simpan hasil tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-tes
          path: app/build/reports/tests/

      - name: Terbitkan APK untuk diunduh dari HP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aurora Shop debug build ${{ github.run_number }}
          prerelease: true
          body: APK debug untuk uji coba. Unduh file .apk di bawah, lalu pasang di HP Android.
          files: AuroraShop-debug-${{ github.run_number }}.apk

      - name: Perbarui rilis "Terbaru" (selalu APK paling baru)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp AuroraShop-debug-${{ github.run_number }}.apk AuroraShop-terbaru.apk
          gh release delete terbaru --cleanup-tag -y || true
          gh release create terbaru AuroraShop-terbaru.apk \
            --target ${{ github.sha }} \
            --title "Aurora Shop - versi terbaru (build ${{ github.run_number }})" \
            --notes "APK paling baru. Unduh AuroraShop-terbaru.apk lalu pasang / update di HP Android." \
            --latest

